name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FOOTBALL-AI-PRO-2.0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL-AI-PRO-2.0.3-APK
          path: app/build/outputs/apk/debug/FOOTBALL-AI-PRO-2.0.3.apk
          if-no-files-found: error
          
